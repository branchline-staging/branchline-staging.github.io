<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Branchline Unified UI — Design Review (Offline)</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--navy:#09264f;--dark:#0d3261;--royal:#075cf5;--cyan:#0dd9eb;--teal:#00dcc2;--ink:#1c3657;--line:#d9e5f4;--fog:#f4f7fc;--panel:#fff;color:var(--ink);background:var(--fog)}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}button[disabled]{cursor:not-allowed;opacity:.6}
header{height:63px;background:var(--navy);color:white;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:2px solid #18529c}
header img{width:42px;height:42px;object-fit:contain;border-radius:11px}header strong{font-size:19px;letter-spacing:-.3px}header small{display:block;color:#b6d0f1;font-size:10px;letter-spacing:.15em}
header .notice{margin-left:auto;font-size:11px;color:#e9f5ff;border:1px solid #6486af;padding:6px 11px;border-radius:20px;white-space:nowrap}
.layout{display:grid;grid-template-columns:77px 220px minmax(0,1fr);min-height:calc(100dvh - 63px)}
.rail{background:linear-gradient(180deg,#0e3767,var(--navy));padding:12px 7px;display:flex;flex-direction:column;gap:7px;border-right:1px solid #365b87}
.rail button{width:62px;min-height:61px;padding:4px;border-radius:11px;border:1px solid transparent;background:transparent;color:#d8e9fc;font-size:10px;font-weight:700;line-height:1.2}
.rail button:hover,.rail button.current{background:transparent;border-color:#35c9f4}.rail button.current{box-shadow:inset 3px 0 var(--teal)}
.rail img{display:block;margin:0 auto 3px;width:42px;height:42px;border-radius:9px;object-fit:contain}
.rail .rail-collapse{margin-top:auto;min-height:37px;color:#fff;font-size:23px}
.side{background:linear-gradient(180deg,#123e74,#0b2c56);color:#fff;border-right:1px solid #2e5b8a;padding:17px 11px 16px;min-width:0;display:flex;flex-direction:column}
.side-head{display:flex;gap:9px;align-items:center;padding:0 2px 18px;border-bottom:1px solid #497099}
.side-head img{width:42px;height:42px;border-radius:10px}.side-head strong{display:block;font-size:13px;line-height:1.2}.side-head small{display:block;font-size:10px;color:#bbd5ef;margin-top:4px}
.side-label{font-size:10px;letter-spacing:.14em;color:#a5c3e2;font-weight:800;margin:22px 9px 10px}
#nav{display:grid;gap:5px}#nav button{background:transparent;color:#dceafe;text-align:left;border:0;border-radius:8px;padding:11px 12px;font-size:12px;min-height:43px}
#nav button:hover,#nav button.active{background:#075bd9;color:#fff}#nav button.active{box-shadow:inset 3px 0 var(--cyan)}
.side-foot{margin-top:auto;border-top:1px solid #497099;padding-top:15px;color:#b3cce8;font-size:11px}
.content{min-width:0;padding:20px clamp(16px,3.2vw,46px) 38px;max-width:1500px;width:100%;margin:0 auto}
.hero{background:linear-gradient(120deg,#07316b,#075ee3 73%,#00b5d5);color:white;border-radius:15px;padding:22px 26px;display:flex;align-items:center;gap:18px;box-shadow:0 10px 25px #173c7d19}
.hero img{width:64px;height:64px;border-radius:14px;object-fit:contain}.hero h1{font-size:clamp(21px,3vw,29px);margin:0 0 5px}.hero p{margin:0;color:#dfebff;font-size:13px}
.canvas{margin-top:19px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 16px #2649790b;padding:20px}
.canvas-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.canvas h2{margin:0;font-size:18px}.muted{color:#6b8098;font-size:12px}.control-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:13px 0}.control-row input[type=search]{flex:1;min-width:190px;height:42px;border:1px solid #c4d4e8;border-radius:9px;padding:0 13px;color:#274466}.pill{background:#edf3ff;color:#2055a2;border:1px solid #cfe2ff;border-radius:7px;padding:9px 12px;font-size:12px;font-weight:700}.pill.primary{background:#075cf5;color:white;border-color:#075cf5}.noticebox{padding:17px;background:#f5f9ff;color:#546e8f;border:1px dashed #bfd1e6;border-radius:10px;font-size:13px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border:1px solid #dbe6f3;border-radius:10px;padding:17px;background:#f9fbff}.stat strong{display:block;margin-top:9px;font-size:24px;color:#104fbc}.stat small{font-size:12px;color:#647c9b}.placeholder-chart{height:220px;border-radius:11px;border:1px dashed #adc7e2;background:repeating-linear-gradient(90deg,#f5f9ff 0,#f5f9ff 66px,#edf4ff 66px,#edf4ff 67px);display:grid;place-items:center;color:#788da8;font-size:14px}
.table-area{overflow-x:auto;margin-top:14px}table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}thead{background:#0750bc;color:#fff}th{text-align:left;padding:12px 10px}td{padding:15px 10px;border-bottom:1px solid #e1e8f4;color:#6a7e98}
.editor-grid{display:grid;grid-template-columns:140px minmax(0,1fr) 220px;gap:13px;min-height:390px}.editor-grid.frame{grid-template-columns:minmax(0,1fr) 230px}.thumbs,.inspector{background:#f4f8ff;border:1px solid #d5e3f3;border-radius:10px;padding:15px}.thumb{height:84px;border:2px solid #9abbf3;border-radius:8px;display:grid;place-items:center;color:#7b93b3;margin-bottom:10px;background:#fff}.workspace-canvas{display:grid;place-items:center;min-height:340px;background:#eaf0f9;border:1px solid #d8e2ef;border-radius:10px}.page-placeholder{width:min(270px,80%);height:300px;border:1px solid #bbd0eb;background:linear-gradient(#fff,#f4f9ff);border-radius:5px;display:grid;place-items:center;text-align:center;color:#8396ae;font-size:13px;padding:20px;box-shadow:0 10px 20px #173a6c16}
.panel-row{border-bottom:1px solid #dce7f5;padding:13px 0;font-size:12px;color:#496586}.panel-row:last-child{border:0}.mobile-toggle{display:none}.overlay{display:none}body.collapsed .layout{grid-template-columns:77px 0 minmax(0,1fr)}body.collapsed .side{display:none}
@media(max-width:850px){.layout{grid-template-columns:65px 185px minmax(0,1fr)}.rail{padding:8px 3px}.rail button{width:59px}.content{padding:15px}.editor-grid{grid-template-columns:110px minmax(0,1fr) 150px}.editor-grid.frame{grid-template-columns:minmax(0,1fr) 150px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){header{height:58px;padding:0 11px}header img{width:35px;height:35px}header strong{font-size:15px}header small{display:none}header .notice{font-size:9px;padding:5px 7px;max-width:125px;white-space:normal;text-align:center}.mobile-toggle{display:block;border:0;background:#13528f;color:#fff;border-radius:7px;padding:6px 9px;font-size:20px}.layout,body.collapsed .layout{display:block;min-height:calc(100dvh - 58px)}.rail,.side{display:none}.content{padding:13px 12px 28px}.hero{padding:16px;gap:12px}.hero img{width:49px;height:49px}.hero h1{font-size:20px}.canvas{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-grid,.editor-grid.frame{grid-template-columns:1fr}.thumbs{display:flex;gap:10px;overflow-x:auto}.thumb{flex:0 0 77px;height:75px}.inspector{max-height:130px;overflow:auto}.overlay.open{position:fixed;inset:58px 0 0;display:block;background:#051d42aa;z-index:20}.overlay .drawer{display:grid;width:min(290px,85vw);height:100%;overflow:auto;background:#0a2b55;color:white;padding:18px;align-content:start;gap:7px}#drawerApps{display:grid;align-content:start;gap:9px}
.drawer button{border:1px solid #79b9ee;background:transparent;color:white;text-align:left;min-height:54px;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:11px;width:100%}
.drawer button:hover{background:transparent;border-color:#c8f1ff}
.drawer button.current{background:transparent;border-color:#34d9f4;box-shadow:inset 3px 0 #34d9f4}
.drawer img{width:40px;height:40px;border-radius:9px;object-fit:contain}
.drawer h2{font-size:15px;margin:0 0 10px}
.drawer button:focus-visible{outline:3px solid #0dd9eb;outline-offset:2px}.control-row input[type=search]{min-width:120px}}
</style></head><body>

function appButton(key){let a=apps[key],b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Show '+a.name);b.title=a.name;b.className='app-entry'+(selected===key?' current':'');b.innerHTML='<img src="'+reviewIcons[a.icon]+'" alt=""><span>'+a.short+'</span>';b.addEventListener('click',()=>{selected=key;section=0;setDrawerOpen(false);draw()});return b;}
function draw(){const rail=el('rail');rail.innerHTML='';rail.appendChild(appButton('ptg'));rail.appendChild(appButton('sales'));rail.appendChild(appButton('megaframe'));rail.appendChild(appButton('megaflyer'));const t=document.createElement('button');t.type='button';t.className='rail-collapse';t.title='Collapse or expand sidebar';t.setAttribute('aria-label','Collapse or expand sidebar');t.textContent=document.body.classList.contains('collapsed')?'»':'«';t.onclick=()=>{document.body.classList.toggle('collapsed');draw()};rail.appendChild(t);
let a=apps[selected];el('sideImg').src=reviewIcons[a.icon];el('sideTitle').textContent=a.name;el('heroImg').src=reviewIcons[a.icon];el('heroTitle').textContent=a.name;el('heroIntro').textContent=a.desc;
const nav=el('nav');nav.innerHTML='';a.menu.forEach((s,i)=>{let b=document.createElement('button');b.type='button';b.className=section===i?'active':'';b.textContent=s;b.setAttribute('aria-current',section===i?'page':'false');b.onclick=()=>{section=i;draw()};nav.appendChild(b)});el('canvas').innerHTML=renderCanvas(a,section);
const drawer=el('drawerApps');drawer.innerHTML='';Object.keys(apps).forEach(k=>drawer.appendChild(appButton(k)));}
function renderCanvas(a,section){const menu=a.menu[section];const head='<div class="canvas-head"><div><h2>'+menu+'</h2><span class="muted">Layout and navigation preview only — no connected records</span></div></div>';
if(section!==0)return head+'<div class="noticebox">'+menu+' will retain its existing controls, permissions, and data. This review build demonstrates the shared navigation and responsive workspace without recreating business logic.</div>';
if(selected==='ptg')return head+'<div class="control-row"><input type="search" aria-label="Product search visual demonstration" placeholder="Search brand, model, barcode, description..."><span class="pill primary">Search</span></div><div class="control-row"><span class="pill">In stock only</span><span class="pill">Regular memos</span><span class="pill">Promotion memos</span><span class="pill">Subdealer prices</span></div><div class="table-area"><table><thead><tr><th>Barcode</th><th>Brand</th><th>Model / Description</th><th>SRP</th><th>Tag This</th><th>Status</th></tr></thead><tbody><tr><td colspan="6">No pricing records loaded in this offline UI preview. Original price/print logic is unchanged.</td></tr></tbody></table></div>';
if(selected==='sales')return head+'<div class="stats"><div class="stat"><small>Net Sales</small><strong>—</strong></div><div class="stat"><small>Transactions</small><strong>—</strong></div><div class="stat"><small>Clients Assisted</small><strong>—</strong></div><div class="stat"><small>Conversion</small><strong>—</strong></div></div><div class="control-row"><span class="muted">Monthly trend / target comparison</span></div><div class="placeholder-chart">Existing authorized sales data appears in the actual app</div>';
const thumbs=selected==='megaflyer'?'<div class="thumbs"><div class="thumb">Page 1</div><div class="thumb">Page 2</div></div>':'';
const panel='<aside class="inspector"><strong style="font-size:13px">Editing tools</strong><div class="panel-row">Position and size</div><div class="panel-row">Text and overlays</div><div class="panel-row">Image enhancements</div><div class="panel-row">Project and export</div></aside>';
