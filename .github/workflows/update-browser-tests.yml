name: Cross-platform update browser fixture
on:
  pull_request:
    branches: [main]
    paths: ['staging/updates/**','staging/tests/update-browser.mjs','.github/workflows/update-browser-tests.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Test desktop and mobile notification behavior using intercepted fixtures
        run: node staging/tests/update-browser.mjs
