name: Live official navigation smoke (staging only, NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - 'qa/live-navigation-smoke.mjs'
      - '.github/workflows/live-navigation-smoke.yml'
permissions:
  contents: read
jobs:
  live-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Verify hosted unified entry and sticky protected Studio navigation without any tokens
        run: node qa/live-navigation-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-staging-live-navigation-screenshots
          path: artifacts/staging-navigation/
          retention-days: 14
          if-no-files-found: warn
