name: Official unified staging Pages (isolated only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/official-unified-staging.yml', 'staging/**']
  push:
    branches: [main]
    paths: ['.github/workflows/official-unified-staging.yml', 'staging/**']
permissions:
  contents: read
concurrency:
  group: official-unified-staging-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCHLINE_ISOLATED_STAGE: '1'
      STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_BASE_PATH: /first-megasaver-ptg
      NEXT_PUBLIC_SUPABASE_URL: https://rlfdvmiqkbitetatxkju.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_URL: https://rlfdvmiqkbitetatxkju.supabase.co
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_PTG_USE_EDGE_AUTH: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_DATA: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ASSETS: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ACCOUNTS: 'true'
      NEXT_PUBLIC_STUDIO_MEGAFRAME_LAUNCH_URL: /megaframe-studio/studio/
      NEXT_PUBLIC_STUDIO_FLYER_LAUNCH_URL: /flyer-studio/studio/
      GITHUB_PAGES: 'true'
      PTG_STUDIO_CUTOVER_PREVIEW: '1'
      MEGAFRAME_STUDIO_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      MEGAFLYER_STUDIO_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
    steps:
      - uses: actions/checkout@v4
        with: {path: staging}
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/branchline
          ref: 476b513d111bcb4c07e233a81f87ff3561e49eec
          path: branchline
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/first-megasaver-ptg
          ref: 5b429bc10cbd3d324b34ff56189a864857e3f2c4
          path: first-megasaver-ptg
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/megaframe-studio
          ref: d1684c8ea43ff9ff233d5ebf519d4d9931412766
          path: megaframe-studio
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/flyer-studio
          ref: 0051ecb2bcdacb4ee39edfecb261b9000ebe5221
          path: flyer-studio
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build PTG on the existing staging origin, with staged APIs
        working-directory: first-megasaver-ptg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("components/workspace-layout.tsx")
          source = p.read_text()
          old = 'href:"/branchline/"'
          assert old in source, "Staging Sales Tracker link drift"
          p.write_text(source.replace(old, 'href:"/sales-tracker/"'))
          landing = Path("app/workspace/page.tsx")
          body = landing.read_text()
          live = "https://kzamora19.github.io/branchline/"
          assert live in body, "Workspace production link drift"
          body = body.replace(live, "https://branchline-staging.github.io/sales-tracker/")
          start = body.index('      <section className="panel install-panel">\n        <h2>Windows installer</h2>')
          end = body.index('      </section>', start) + len('      </section>')
          body = body[:start] + ('      <p className="admin-muted">Windows installers are not provided in isolated staging. Use the browser preview.</p>') + body[end:]
          landing.write_text(body)
          mobile = Path("app/workspace/mobile/workspace.tsx")
          mobile.write_text(mobile.read_text().replace('/branchline/', '/sales-tracker/'))
          PY
          npm install --ignore-scripts --no-package-lock
          npm run build
          test -f out/studios/index.html
      - name: Build public-only MegaFrame Studio launcher
        working-directory: megaframe-studio
        run: |
          node staging/build-cutover-pages.mjs staging/stage-pages-cutover
          test -f staging/stage-pages-cutover/studio/index.html
      - name: Build public-only MegaFlyer Studio launcher
        working-directory: flyer-studio
        run: |
          node scripts/build-cutover-pages.mjs staging/stage-pages-cutover
          test -f staging/stage-pages-cutover/studio/index.html
      - name: Combine apps and reject production-host references
        working-directory: staging
        run: python3 staging/assemble-site.py
      - name: Validate preserved staging sign-in and hosted app routes
        working-directory: staging
        run: |
          test -f staging-site-dist/index.html
          test -f staging-site-dist/sales-tracker/apps/index.html
          test -f staging-site-dist/first-megasaver-ptg/login/index.html
          test -f staging-site-dist/megaframe-studio/studio/index.html
          test -f staging-site-dist/flyer-studio/studio/index.html
          # Both protected Studios must keep the official app-logo menu visible
          # at narrow mobile widths, even after scrolling past backup controls.
          grep -q 'position:sticky;top:0' staging-site-dist/megaframe-studio/studio/index.html
          grep -q 'position:sticky;top:0' staging-site-dist/flyer-studio/studio/index.html
          grep -q 'Open unified PTG sign-in' staging-site-dist/index.html
          test -f staging-site-dist/STAGING-RELEASE-MANIFEST.json
          test -s staging-site-dist/sales-tracker/icons/official/branchline.png
          test -s staging-site-dist/first-megasaver-ptg/icons/official/data-desk.png
      - uses: actions/upload-artifact@v4
        with:
          name: official-unified-staging-review
          path: staging/staging-site-dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Mirror verified build to staging-only branch Pages source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: staging
        run: |
          test "$GITHUB_REPOSITORY" = "branchline-staging/branchline-staging.github.io"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("staging-site-dist/STAGING-RELEASE-MANIFEST.json").read_text())
          assert manifest["host"]=="branchline-staging.github.io"
          assert manifest["supabase"]=="rlfdvmiqkbitetatxkju"
          assert manifest["privateEditorsPublished"] is False
          for file in ("index.html","sales-tracker/icons/official/branchline.png",
                       "first-megasaver-ptg/icons/official/data-desk.png",
                       "megaframe-studio/studio/index.html",
                       "flyer-studio/studio/index.html"):
              assert (Path("staging-site-dist")/file).is_file(), file
          PY
          # This staging repository also has legacy main-branch Pages builds.
          # Keep their source identical to the verified Actions Pages artifact
          # so subsequent pushes cannot replace the site with incomplete files.
          rm -rf sales-tracker first-megasaver-ptg megaframe-studio flyer-studio
          cp -a staging-site-dist/sales-tracker .
          cp -a staging-site-dist/first-megasaver-ptg .
          cp -a staging-site-dist/megaframe-studio .
          cp -a staging-site-dist/flyer-studio .
          cp staging-site-dist/index.html index.html
          cp staging-site-dist/.nojekyll .nojekyll
          cp staging-site-dist/STAGING-RELEASE-MANIFEST.json STAGING-RELEASE-MANIFEST.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html .nojekyll STAGING-RELEASE-MANIFEST.json sales-tracker first-megasaver-ptg megaframe-studio flyer-studio
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging): publish verified static bundle to Pages branch source"
            git push origin HEAD:main
          fi
      - name: Upload Pages content on staging main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: {path: staging/staging-site-dist}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
