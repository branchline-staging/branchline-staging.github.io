name: Official unified staging Pages (isolated only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/official-unified-staging.yml', 'staging/**']
  push:
    branches: [main]
    paths: ['.github/workflows/official-unified-staging.yml', 'staging/**']
permissions:
  contents: read
concurrency:
  group: official-unified-staging-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCHLINE_ISOLATED_STAGE: '1'
      STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_BASE_PATH: /first-megasaver-ptg
      NEXT_PUBLIC_SUPABASE_URL: https://rlfdvmiqkbitetatxkju.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_URL: https://rlfdvmiqkbitetatxkju.supabase.co
      NEXT_PUBLIC_SALES_TRACKER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      NEXT_PUBLIC_PTG_USE_EDGE_AUTH: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_DATA: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ASSETS: 'true'
      NEXT_PUBLIC_PTG_USE_EDGE_ACCOUNTS: 'true'
      NEXT_PUBLIC_STUDIO_MEGAFRAME_LAUNCH_URL: /megaframe-studio/studio/
      NEXT_PUBLIC_STUDIO_FLYER_LAUNCH_URL: /flyer-studio/studio/
      GITHUB_PAGES: 'true'
      PTG_STUDIO_CUTOVER_PREVIEW: '1'
      MEGAFRAME_STUDIO_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
      MEGAFLYER_STUDIO_PUBLISHABLE_KEY: sb_publishable_esYvIjnW_CJiP09FN0Pwww_8okkANzw
    steps:
      - uses: actions/checkout@v4
        with: {path: staging}
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/branchline
          ref: 476b513d111bcb4c07e233a81f87ff3561e49eec
          path: branchline
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/first-megasaver-ptg
          ref: 5b429bc10cbd3d324b34ff56189a864857e3f2c4
          path: first-megasaver-ptg
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/megaframe-studio
          ref: 86fe050718d83007ac828d5a24c3a55a02551075
          path: megaframe-studio
      - uses: actions/checkout@v4
        with:
          repository: kzamora19/flyer-studio
          ref: 5ae36a0fff420b2645993c7b8c7262e2a02da505
          path: flyer-studio
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build PTG on the existing staging origin, with staged APIs
        working-directory: first-megasaver-ptg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("components/workspace-layout.tsx")
          source = p.read_text()
          old = 'href:"/branchline/"'
          assert old in source, "Staging Sales Tracker link drift"
          p.write_text(source.replace(old, 'href:"/sales-tracker/"'))
          PY
          npm install --ignore-scripts --no-package-lock
          npm run build
          test -f out/studios/index.html
      - name: Build public-only MegaFrame Studio launcher
        working-directory: megaframe-studio
        run: |
          node staging/build-cutover-pages.mjs staging/stage-pages-cutover
          test -f staging/stage-pages-cutover/studio/index.html
      - name: Build public-only MegaFlyer Studio launcher
        working-directory: flyer-studio
        run: |
          node scripts/build-cutover-pages.mjs staging/stage-pages-cutover
          test -f staging/stage-pages-cutover/studio/index.html
      - name: Combine apps and reject production-host references
        working-directory: staging
        run: python3 staging/assemble-site.py
      - name: Validate preserved staging sign-in and hosted app routes
        working-directory: staging
        run: |
          test -f staging-site-dist/index.html
          test -f staging-site-dist/sales-tracker/apps/index.html
          test -f staging-site-dist/first-megasaver-ptg/login/index.html
          test -f staging-site-dist/megaframe-studio/studio/index.html
          test -f staging-site-dist/flyer-studio/studio/index.html
          test -f staging-site-dist/STAGING-RELEASE-MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-unified-staging-review
          path: staging/staging-site-dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Upload Pages content on staging main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: {path: staging/staging-site-dist}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
