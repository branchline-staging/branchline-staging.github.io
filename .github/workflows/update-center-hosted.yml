name: Hosted staging update center smoke
on:
  pull_request:
    branches: [main]
    paths: ['qa/update-center-hosted.mjs','.github/workflows/update-center-hosted.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify current hosted staging release without credentials
        run: node qa/update-center-hosted.mjs
