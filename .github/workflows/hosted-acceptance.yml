name: LIVE hosted staging acceptance — browser, Drive simulation, printing
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hosted-acceptance.yml'
      - 'staging/tests/hosted-acceptance.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-acceptance.yml'
      - 'staging/tests/hosted-acceptance.mjs'
permissions:
  contents: read
jobs:
  hosted-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium (no saved user sessions)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Test ACTUAL hosted staging, security gates, synthetic encrypted backup, PTG demo PDF
        run: node staging/tests/hosted-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-staging-acceptance-screenshots-print-and-audit
          path: artifacts/hosted-acceptance/
          if-no-files-found: warn
          retention-days: 14
